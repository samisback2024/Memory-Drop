<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#9333ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent draws the page content up through/behind the
         status bar (the standard native-app look — Instagram/Twitter/etc
         all do this) instead of iOS reserving an opaque white strip above
         the page. This is also what makes env(safe-area-inset-top) start
         resolving to a real value instead of 0 — every place that now
         pads for it (Navbar, MomentViewer, MediaViewer, MomentPileGround)
         only matters because of this line. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Memory Drop" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- viewport-fit=cover lets the page draw edge-to-edge on notch/Dynamic-
         Island/home-indicator devices instead of Safari/Chrome letterboxing
         behind a safe strip — required for env(safe-area-inset-*) to
         resolve to anything other than 0 everywhere this app already uses
         it (MobileNav, MomentPileGround) or is about to. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Capture today. Unlock tomorrow. Memory Drop is a time-capsule social app." />
    <title>Memory Drop</title>

    <!-- Social preview (Open Graph + Twitter Card). image/url use a
         relative path since this app's final production domain isn't
         set yet — see LAUNCH_CHECKLIST.md, "Replace social preview
         URLs with the real production domain" is a real pre-launch
         action item, not done here since guessing a domain would be
         worse than leaving it relative. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Memory Drop" />
    <meta property="og:title" content="Memory Drop" />
    <meta property="og:description" content="Capture today. Unlock tomorrow. Memory Drop is a time-capsule social app." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Memory Drop" />
    <meta name="twitter:description" content="Capture today. Unlock tomorrow. Memory Drop is a time-capsule social app." />
    <meta name="twitter:image" content="/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
